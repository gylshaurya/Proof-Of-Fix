<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Contractor | Proof of Fix</title>
  <link rel="stylesheet" href="../css/ui.css" />
  <link rel="stylesheet" href="../css/contractor.css" />
</head>

<body>
  <header class="app-header">
    <div class="header-left">
      <h1>Contractor Dashboard</h1>
      <p><span id="localityBadge">Locality</span></p>
    </div>
    <div class="header-right">
      <div id="wallet-card" class="wallet-card"></div>
      <button id="homeBtn" class="btn btn-ghost">Resident view</button>
      <button id="logoutBtn" class="btn btn-ghost">Log out</button>
    </div>
  </header>

  <main class="main-container">
    <section class="stats">
      <div class="stat">
        <p>Wallet balance</p>
        <h3 id="balance">-</h3>
      </div>
      <div class="stat">
        <p>Assigned jobs</p>
        <h3 id="statTotal">0</h3>
      </div>
      <div class="stat">
        <p>In progress</p>
        <h3 id="statProgress">0</h3>
      </div>
      <div class="stat">
        <p>Completed</p>
        <h3 id="statCompleted">0</h3>
      </div>
    </section>

    <section class="content">
      <div class="section-head">
        <h2>Your jobs</h2>
        <p class="section-hint">Post updates as you work. Mark a job complete to start resident verification.</p>
      </div>
      <div id="problemsContainer"></div>
    </section>
  </main>

  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <script type="module" src="../js/supabaseClient.js"></script>
  <script type="module" src="../js/pages/contractor.js"></script>
</body>
</html>
