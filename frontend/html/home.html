<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dashboard | Proof of Fix</title>
  <link rel="stylesheet" href="../css/ui.css" />
  <link rel="stylesheet" href="../css/home.css" />
</head>
<body>
  <header class="app-header">
    <div class="header-left">
      <h1>Civic Dashboard</h1>
      <p>Issues reported in your neighbourhood</p>
    </div>
    <div class="header-right">
      <div id="wallet-card" class="wallet-card"></div>
      <button id="contractor-btn" class="btn btn-ghost" hidden>Contractor view</button>
      <button id="logout" class="btn btn-ghost">Log out</button>
    </div>
  </header>

  <main class="main-container">
    <section class="user-card">
      <div id="user-info"></div>
      <button id="report-btn" class="btn btn-primary">Report an issue</button>
    </section>

    <section class="problems-section">
      <div class="section-head">
        <h2>Local issues</h2>
        <span class="count-pill"><span id="active-count">0</span> active</span>
      </div>
      <div id="cards-container" class="cards-grid"></div>
    </section>
  </main>

  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <script type="module" src="../js/supabaseClient.js"></script>
  <script type="module" src="../js/pages/home.js"></script>
</body>
</html>
