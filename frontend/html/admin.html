<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ward office — Proof of Fix</title>
  <link rel="stylesheet" href="../css/ui.css" />
  <link rel="stylesheet" href="../css/app.css" />
</head>

<body>
  <header class="app-bar">
    <div class="shell app-bar-inner">
      <a class="brand" href="index.html">
        <span class="brand-mark" aria-hidden="true"></span>
        Proof of Fix
      </a>
      <nav class="app-nav" aria-label="Main">
        <a href="admin.html" aria-current="page">Ward office</a>
        <a href="home.html">Issues</a>
      </nav>
      <div class="app-actions">
        <span class="chip" id="roundInfo">Round —</span>
        <span class="chip" id="quorumInfo">Quorum —</span>
        <button id="newRoundBtn" class="btn btn-sm btn-quiet">New round</button>
        <button class="theme-toggle" id="themeToggle" type="button" aria-label="Switch theme">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8"
            stroke-linecap="round" aria-hidden="true">
            <circle cx="12" cy="12" r="4.2" />
            <path d="M12 2.4v2.2M12 19.4v2.2M4.2 12H2M22 12h-2.2M5.6 5.6 4 4M20 20l-1.6-1.6M18.4 5.6 20 4M4 20l1.6-1.6" />
          </svg>
        </button>
        <button id="logoutBtn" class="btn btn-sm btn-ghost">Sign out</button>
      </div>
    </div>
  </header>

  <main class="shell page">
    <div class="page-head">
      <div>
        <h1>Ward office</h1>
        <p>Open voting rounds, fund the winners, settle completed work.</p>
      </div>
    </div>

    <div id="walletNotice" class="notice notice-warn" hidden>
      MetaMask is required. Connect the government wallet to manage problems on chain.
    </div>

    <div id="problemsContainer"></div>
  </main>

  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <script type="module" src="../js/supabaseClient.js"></script>
  <script type="module" src="../js/pages/admin.js"></script>
</body>

</html>
