<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin | Proof of Fix</title>
  <link rel="stylesheet" href="../css/ui.css" />
  <link rel="stylesheet" href="../css/admin.css" />
</head>

<body>
  <header class="app-header">
    <div class="header-left">
      <h1>Government Panel</h1>
      <p>Open voting, fund escrows and settle completed work</p>
    </div>
    <div class="header-right">
      <span id="roundInfo" class="chip"></span>
      <span id="quorumInfo" class="chip chip-muted"></span>
      <button id="newRoundBtn" class="btn btn-ghost">New round</button>
      <button id="logoutBtn" class="btn btn-ghost">Log out</button>
    </div>
  </header>

  <main class="main-container">
    <div id="walletNotice" class="notice notice-warn" hidden>
      MetaMask is required. Connect the government wallet to manage problems on chain.
    </div>

    <div id="problemsContainer"></div>
  </main>

  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <script type="module" src="../js/supabaseClient.js"></script>
  <script type="module" src="../js/pages/admin.js"></script>
</body>
</html>
